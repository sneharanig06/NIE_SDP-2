<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Layout</title>
  <link rel="stylesheet" href="SDK.css">
</head>
<body>

  <div class="container">
    
    <!-- Top Header Section -->
    <header class="profile-header">
      <div class="photo-circle">
        <!-- Replace 'profile.jpg' with your profile image path -->
        <img src="SAGUN.jpeg" alt="">
      </div>
      <div class="profile-info">
        <h1>SNEHA RANI</h1>
        <p>Aspiring Software Engineer</p>
      </div>
    </header>

    <!-- Content Cards Grid -->
    <main class="cards-grid">
      
      <!-- First Row: Education Cards with Images -->
      <div class="row education-row">
        
        <div class="card card-img">
          <!-- Replace 'school.jpg' with your school image path -->
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjIxG7t2LsWqkL6Vkbdr5gogDIiZCjNHFPpYOBMd2ETQ&s=10" alt="Your School">
          <span class="card-caption">Notre Dame School</span>
        </div>

        <div class="card card-img">
          <!-- Replace 'pu-college.jpg' with your PU college image path -->
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTJdDLA_C9bV1JxhDcn3-3y52Opaqk6uXG838wcT3oYQ&s=10" alt="Your PU College">
          <span class="card-caption">Oxford Public School Ranchi</span>
        </div>

        <div class="card card-img">
          <!-- Replace 'engineering-college.jpg' with your engineering college image path -->
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2GzhjcxpKpyr76rb0PDu-cEsOC53Wap9GyTCdgb8dRQ&s=10" alt="Your Engineering College">
          <span class="card-caption">NIE Mysuru</span>
        </div>

      </div>

      <!-- Second Row: Achievements List -->
      <div class="row achievements-row">

        <div class="card achievement-card">
          <h3>Your Achievements</h3>
          <ul class="achievements-list">
            <li>First achievement goes here</li>
            <li>Second achievement goes here</li>
            <li>Third achievement goes here</li>
          </ul>
        </div>

      </div>

    </main>

  </div>
  <a href="website.html">website</a>

</body>
</html>
